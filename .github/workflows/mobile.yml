name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - "games/chicken-hop/**"
      - "package.json"
      - "package-lock.json"
      - "src/test/chicken-hop-*.test.ts"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "games/chicken-hop/**"
      - "package.json"
      - "package-lock.json"
      - "src/test/chicken-hop-*.test.ts"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  native-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo dependencies
        run: npm run doctor

      - name: Bundle iOS and Android
        run: npm run export:native
